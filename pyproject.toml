[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elevator-simulation"
version = "0.1.0"
description = "Discrete-time destination-dispatch elevator simulation"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
include = ["domain*", "application*", "infrastructure*", "api*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["domain", "application", "infrastructure", "api", "contracts", "tests"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.13"

# Scoped relaxations for third-party stub quality we don't control — not a general
# weakening of strictness for our own code, which stays fully strict everywhere else.
# Note: setting `root` on an executionEnvironment also narrows its import-resolution
# root, so extraPaths = ["."] is required in each one to keep project-relative imports
# (e.g. `from application.exceptions import ...`) resolving the same as everywhere else.
# venvPath/venv are NOT valid executionEnvironment keys (pyright warns and ignores them
# here) — they only apply at the top level, which already covers every environment.
[[tool.pyright.executionEnvironments]]
# dependency-injector's own type stubs don't propagate concrete Provider types, isolated to
# this one file: this is where each layer now owns its DI registration (domain/,
# infrastructure/ don't hit it — only application/dependency_injection.py's
# nested-container attribute access, e.g. `domain.scheduling_policy`, triggers it).
root = "application/dependency_injection.py"
extraPaths = ["."]
reportUnknownMemberType = false

[[tool.pyright.executionEnvironments]]
# Starlette's TestClient / httpx have the same imprecise-stub issue for .post()/.get()
# response typing — everything downstream of a response object reports as Unknown. Also
# covers the former tests/composition/ suite (now here too): dependency-injector's own
# Provider[Unknown] gap for tests exercising built containers directly.
root = "tests/api"
extraPaths = ["."]
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "api", "contracts"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own DI pattern (`param: T = Depends(get_t)`) is the idiomatic way to declare
# route dependencies — B008 exists to catch accidental mutable-default-argument bugs, not
# this. Framework's convention wins over the generic rule.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]
